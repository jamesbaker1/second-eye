# Weekly dependency updates. Minor and patch versions of each ecosystem come
# as one grouped pull request, so they are reviewed and merged together; a
# major version comes on its own, since it is the one likely to need a code
# change. Security updates are not held to this schedule.
version: 2
updates:
  # pyproject.toml.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # The Worker (cloudflare/) and the document-system MCP server
  # (cloudflare/dms-mcp/), each with its own package-lock.json. site/ has no
  # package.json: it deploys with cloudflare/'s Wrangler.
  - package-ecosystem: npm
    directories:
      - /cloudflare
      - /cloudflare/dms-mcp
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # The actions the workflows use, including the ones pinned to a commit.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
