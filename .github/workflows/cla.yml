name: CLA

# Asks the author of every pull request to sign the Contributor Licence
# Agreement (CLA.md) once, by commenting on the pull request, and records the
# signature in this repository on the branch `cla-signatures`, file
# signatures/version1/cla.json. That branch must exist before the first pull
# request (an orphan branch with one empty commit is enough) and must not be
# protected, since the action commits to it.
#
# pull_request_target and issue_comment run with this repository's token even
# for a pull request from a fork. That is safe here, and only here, because
# this workflow never checks out or runs the pull request's code: the action
# reads the pull request's commit authors through the API and writes to the
# signatures branch. Do not add a checkout or any step that runs code from the
# pull request to this file.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # A pull request event, or a comment that signs or asks for a recheck.
    # Not in the private development repository: only the owner and bots
    # open pull requests there, and it has no signatures branch.
    if: >-
      github.repository != 'jamesbaker1/second-eye-private' &&
      (github.event_name == 'pull_request_target' ||
       (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')))
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          # CLA.md on the default branch of whichever repository this runs
          # in, so the link is right in the public repository without editing.
          path-to-document: https://github.com/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CLA.md
          branch: cla-signatures
          # The owner (who needs no licence from himself) and bots.
          allowlist: jamesbaker1,dependabot[bot],*[bot]
          lock-pullrequest-aftermerge: false
