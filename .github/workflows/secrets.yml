name: Secret scan

# gitleaks over the commits a push or pull request brings, and over the whole
# history on every push to main. The CLI itself, downloaded from a pinned
# release and checked against its published checksum, rather than
# gitleaks/gitleaks-action, which needs a paid licence key for a repository
# owned by an organisation. Needs no secret, so it runs the same on a pull
# request from a fork. False positives in test fixtures are allowed, narrowly
# and with reasons, in .gitleaks.toml.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, from that
  # release's gitleaks_${GITLEAKS_VERSION}_checksums.txt. Change both together.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # Which commits: the whole history on main; on a pull request, the
      # commits it adds over its base; on a push elsewhere, the commits the
      # push added (or the whole history for a new branch, whose "before" is
      # all zeros).
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$REF" != "refs/heads/main" ] && [ -n "$BEFORE" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          fi
          if [ -n "$range" ]; then
            echo "Scanning $range"
            "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --log-opts="$range" .
          else
            echo "Scanning the whole history"
            "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner .
          fi
