# The comments agent: turns the comments and the other side's tracked changes
# in a Word document, as a lawyer does in Word, in a session nobody is
# attached to (src/secondeye/comments.py). It works only through the lra-comments
# skill's scripts, and leaves the turned document, a blackline when it
# decided the other side's changes, and turned.json in /mnt/session/outputs.
#
# Its own agent, and detached, for the reasons review.agent.yaml
# gives: NO custom tools, ever, because a custom tool call in a session with
# no client waits for ever. The host checks the returned file itself
# (turning.examine) and, when something is wrong, sends the report back as a
# message and lets the agent decide how to fix it (DECISIONS 30).
#
# Applied by `second-eye agents apply`, printed as MANAGED_COMMENTS_AGENT_ID, with the
# same skills and settings-driven fields as the others, plus lra-comments
# (extra_skills), which only this agent is offered: `second-eye skills sync
# lra-comments`, then apply again. Without it the agent has no way to write
# a reply or a resolved thread, and says so.
name: LRA comments
description: >-
  Turns the comments and tracked changes in a Word document: makes the clear
  changes as tracked changes, replies in each comment's thread, resolves what
  is done and leaves open with a question what needs judgment; accepts or
  rejects the other side's changes by id and writes counter-proposals. Works
  only through the lra-comments scripts; everything it produces is a file.
model: claude-fable-5-1
system_file: ../src/secondeye/prompts/comments_system.md
extra_skills:
  - sandbox_comments_skill_id
tools:
  - type: agent_toolset_20260401
    default_config:
      enabled: true
      permission_policy:
        type: always_allow
    configs:
      - name: web_search
        enabled: false
      - name: web_fetch
        enabled: false
